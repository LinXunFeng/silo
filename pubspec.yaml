name: silo_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/core
  - packages/cli
  - apps/silo

dev_dependencies:
  lints: ^5.0.0
  melos: ^8.3.0
  test: ^1.25.0

melos:
  repository: https://github.com/LinXunFeng/silo

  command:
    version:
      # One product, one version number: core, cli and the app move together.
      mode: fixed
      # A root CHANGELOG.md is the one a reader actually opens.
      workspaceChangelog: true
      includeScopes: true
      linkToCommits: true
      changelogFormat:
        groupByType: true

  scripts:
    release:
      description: >-
        Cut a release: version the workspace from the conventional commits
        since the last one, tag it v<version>, push, and wait for the Release
        workflow to publish the GitHub release and its artifacts. Options
        pass through to scripts/release.sh (--yes, --no-check).
      run: ./scripts/release.sh

    analyze:
      description: Analyze every package in the workspace.
      run: dart analyze

    test:
      description: Run every test in the workspace.
      # steps run through melos itself, so no `melos` on PATH is needed.
      steps:
        - test:dart
        - test:flutter

    test:dart:
      description: Run the pure-Dart package tests.
      exec: dart test
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      description: Run the Flutter app tests.
      exec: flutter test
      packageFilters:
        flutter: true
        dirExists: test
