name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this one, so a failing check blocks the release.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS runner: silo_core's tests spin up a local HttpServer and the app
    # tests need Flutter — one machine covers both.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      # The repo root is a Dart workspace: one pub get resolves all three packages.
      - run: flutter pub get

      # Both steps are melos scripts, so CI and a local run stay in step.
      - name: Analyze
        run: dart run melos run analyze

      - name: Test
        run: dart run melos run test
