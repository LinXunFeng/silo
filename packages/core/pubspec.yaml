name: silo_core
description: Source-agnostic download engine, model source plugins, content-addressed blob store and tool targets for Silo.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

# Intentionally zero runtime dependencies: everything is built on dart:io /
# dart:convert / dart:typed_data. This keeps the engine embeddable from both the
# CLI and the Flutter app without dragging a dependency tree into either.

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
